[project]
name = "quitter"
version = "0.1.0"
description = "QUITTER — 90 dagen. Volgens schema. Het complete bedrijfssysteem: catalogus, afbouwschema's, financieel model, AI-agentteam en interne cockpit."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.40.0",
    "anthropic>=0.116.0",
    "pandas>=2.2.0",
]

[project.scripts]
quitter = "quitter.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quitter"]
